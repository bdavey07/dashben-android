<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DashBen</title>
<link rel="icon" type="image/svg+xml" href="/favicon-v2.svg">
<script>try{var t=localStorage.getItem("dashben-theme")||"ember";if(t!=="blueprint")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="stylesheet" href="./styles.css?v=ef">
<link rel="stylesheet" href="./fonts.css">
<script src="./vendor/sql-wasm.js"></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="menu-card" role="tablist">
      <button id="sync-btn" class="primary-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg><span>Sync now</span></button>
      <button class="tab-btn" data-tab="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span></button>
      <button class="tab-btn" data-tab="daily"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Daily</span></button>
      <button class="tab-btn" data-tab="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h8M8 17h5"/></svg><span>Calendar</span></button>
      <button class="tab-btn" data-tab="tasks"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 12l3 3 5-6"/></svg><span>Tasks</span></button>
      <button class="tab-btn" data-tab="notes"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg><span>Notes</span></button>
      <button class="tab-btn" data-tab="projects"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Projects</span></button>
      <button class="tab-btn" data-tab="reading"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5V21.5"/></svg><span>Reading</span></button>
      <button class="tab-btn" data-tab="feed"><svg viewBox="0 0 24 24"><path d="M3 6a1 1 0 0 1 1-1h13v14H4a1 1 0 0 1-1-1z"/><path d="M17 9h3v9a2 2 0 0 1-2 2h-1"/><path d="M6.5 9h7M6.5 13h7M6.5 17h4"/></svg><span>Feed</span></button>
      <button class="tab-btn" data-tab="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 15c2.8.3 4.7 1.7 5.5 4.5"/></svg><span>People</span></button>
      <button class="tab-btn" data-tab="inbox"><svg viewBox="0 0 24 24"><path d="M3 8l9 6 9-6"/><path d="M3 8v9h18V8"/><path d="M3 8l9-5 9 5"/></svg><span>Inbox</span></button>
      <button class="tab-btn" data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.5-3.5"/></svg><span>Search</span></button>
      <button class="tab-btn" data-tab="management"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Management</span></button>
    </div>
  </aside>
  <div class="content">
    <header class="topbar">
      <button id="menu-btn" class="ghost-btn" aria-label="Menu">☰</button>
      <button id="collapse-btn" class="ghost-btn" aria-label="Collapse sidebar">«</button>
      <h1>DashBen</h1>
      <span class="badge">LIVE</span>
      <span id="net-badge" class="badge"></span>
      <button id="feed-btn" class="ghost-btn" aria-label="Open feed"><svg viewBox="0 0 24 24"><path d="M3 6a1 1 0 0 1 1-1h13v14H4a1 1 0 0 1-1-1z"/><path d="M17 9h3v9a2 2 0 0 1-2 2h-1"/><path d="M6.5 9h7M6.5 13h7M6.5 17h4"/></svg></button>
      <button id="palette-btn" class="ghost-btn" aria-label="Command palette">⌘K</button>
    </header>
    <main id="main"><p class="muted">Loading local database…</p></main>
    <footer class="muted">DashBen — build m3-2026-11-04ef + mgmt token — your data lives in this browser until it syncs. Going offline never blocks reading or writing. <span id="sync-status" class="status"></span></footer>
  </div>
</div>
<div id="ptr-indicator" aria-hidden="true">Pull to sync…</div>
<button id="fab-capture" aria-label="Capture to inbox">+</button>
<div id="fab-menu" hidden>
  <button data-fab-menu="capture"><svg viewBox="0 0 24 24"><path d="M3 9l2.5-5h13L21 9v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l2 3h4l2-3h5"/></svg><span>Capture</span></button>
  <button data-fab-menu="task"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 12l3 3 5-6"/></svg><span>Task</span></button>
  <button data-fab-menu="note"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg><span>Quick Note</span></button>
  <button data-fab-menu="schedule"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Schedule</span></button>
</div>
<nav id="bottom-nav" aria-label="Sections">
  <button class="tab-btn" data-tab="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span></button>
  <button class="tab-btn" data-tab="tasks"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 12l3 3 5-6"/></svg><span>Tasks</span></button>
  <button class="tab-btn" data-tab="daily"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v4M10 15h4"/></svg><span>Daily</span></button>
  <button class="tab-btn" data-tab="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
  <button class="tab-btn" data-tab="notes"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg><span>Notes</span></button>
</nav>
<div id="popup-root"></div>
<div id="palette-root"></div>
<div id="toast-root"></div>
<script type="module" src="./app.mjs?v=ef"></script>
</body>
</html>
